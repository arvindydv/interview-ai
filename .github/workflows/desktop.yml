# Builds the Tauri desktop app for every supported OS.
#   macOS:   universal .dmg / .app (Apple Silicon + Intel)
#   Windows: NSIS .exe + .msi
#   Linux:   .deb (Ubuntu/Debian), .rpm (Fedora), .AppImage (any distro, incl. Arch)
# Built on Ubuntu 22.04 so the Linux binaries run on older and newer glibc alike.
#
# Pushing a desktop-v* tag also uploads every installer to a draft GitHub Release for that tag, and to
# the downloads CDN (infra/downloads.tf) at $DOWNLOADS_HOST/desktop/v<version>/, which is what the website's
# NEXT_PUBLIC_DOWNLOADS_URL should point at: GitHub's release-asset CDN is very slow from many Indian ISPs.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['apps/desktop/**', 'packages/shared/**', '.github/workflows/desktop.yml']

permissions:
  contents: write # create the GitHub Release on desktop-v* tags
  id-token: write # OIDC token for AWS (uploading installers to the downloads CDN)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      # Production endpoints are baked in at compile time (see src-tauri/build.rs).
      PARAKEET_WEB_URL: ${{ vars.PARAKEET_WEB_URL }}
      PARAKEET_API_URL: ${{ vars.PARAKEET_API_URL }}
      PARAKEET_SUPABASE_URL: ${{ vars.PARAKEET_SUPABASE_URL }}
      PARAKEET_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PARAKEET_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parakeet/shared build

      # macOS signing + notarisation, enabled once the APPLE_* repo secrets exist (Developer ID Application
      # certificate as base64 .p12, plus an app-specific password). Without them the app is only ad-hoc
      # signed (tauri.conf.json signingIdentity "-") and Gatekeeper asks users to approve it in Settings.
      - name: macOS signing secrets
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "No APPLE_CERTIFICATE secret: building ad-hoc signed."; exit 0; }
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            { echo "$k<<__EOF__"; printenv "$k"; echo "__EOF__"; } >> "$GITHUB_ENV"
          done

      # Windows: unsigned installers trigger SmartScreen ("Windows protected your PC"). Set
      # bundle.windows.signCommand in tauri.conf.json once a code-signing certificate is available.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # Only tag builds publish; PR and manual builds just upload workflow artifacts below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: 'Friday AI ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your system below.'
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: parakeet-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: error

  # Tag builds only: copy every installer to the downloads CDN under desktop/v<version>/.
  publish-cdn:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') && vars.DESKTOP_UPLOAD_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parakeet-*
          path: artifacts

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DESKTOP_UPLOAD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Same names GitHub Releases uses (spaces become dots), so the website builds identical URLs either way.
      - name: Upload installers
        env:
          BUCKET: ${{ vars.DOWNLOADS_BUCKET }}
          HOST: ${{ vars.DOWNLOADS_HOST }}
        run: |
          dir="desktop/v${GITHUB_REF_NAME#desktop-v}"
          DEST="s3://$BUCKET/$dir"
          find artifacts -type f | while read -r f; do
            name="$(basename "$f" | tr ' ' '.')"
            aws s3 cp --only-show-errors "$f" "$DEST/$name" \
              --content-type application/octet-stream \
              --content-disposition "attachment; filename=\"$name\"" \
              --cache-control "public, max-age=31536000, immutable"
            echo "$DEST/$name"
          done
          echo "Set NEXT_PUBLIC_DOWNLOADS_URL to $HOST/$dir" >> "$GITHUB_STEP_SUMMARY"

# Builds the Tauri desktop app for every supported OS.
#   macOS:   universal .dmg / .app (Apple Silicon + Intel)
#   Windows: NSIS .exe + .msi
#   Linux:   .deb (Ubuntu/Debian), .rpm (Fedora), .AppImage (any distro, incl. Arch)
# Built on Ubuntu 22.04 so the Linux binaries run on older and newer glibc alike.
#
# Pushing a desktop-v* tag also uploads every installer to a draft GitHub Release for that tag;
# review it and click Publish. Release asset URLs feed NEXT_PUBLIC_DOWNLOADS_URL on the website.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['apps/desktop/**', 'packages/shared/**', '.github/workflows/desktop.yml']

permissions:
  contents: write # create the GitHub Release on desktop-v* tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      # Production endpoints are baked in at compile time (see src-tauri/build.rs).
      PARAKEET_WEB_URL: ${{ vars.PARAKEET_WEB_URL }}
      PARAKEET_API_URL: ${{ vars.PARAKEET_API_URL }}
      PARAKEET_SUPABASE_URL: ${{ vars.PARAKEET_SUPABASE_URL }}
      PARAKEET_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PARAKEET_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parakeet/shared build

      # Code signing: add APPLE_* (macOS notarisation) and Windows certificate secrets here before
      # distributing; unsigned builds trigger Gatekeeper / SmartScreen warnings.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # Only tag builds publish; PR and manual builds just upload workflow artifacts below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: 'Friday AI ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your system below.'
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: parakeet-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: error

# Hourly uptime check of the live site and API. /health queries Postgres, so this also keeps a
# free-plan Supabase project from pausing for inactivity. A failure emails the repo owner (GitHub's
# default notification for failed workflows).
#
# Note: GitHub disables scheduled workflows after 60 days without commits to the repo; re-enable it
# under Actions → Uptime if that happens.
name: Uptime

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: vars.NEXT_PUBLIC_API_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: API (Postgres, Redis, Auth)
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 "${{ vars.NEXT_PUBLIC_API_URL }}/health"
      - name: Website
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 -o /dev/null "${{ vars.WEB_URL }}"

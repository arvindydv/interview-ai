# Checks every pull request: typecheck the whole workspace, run the unit tests and build each server
# image, so a broken Dockerfile or build never reaches main (where Deploy ships it).
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parakeet/shared --filter @parakeet/emails exec tsc -p tsconfig.json
      - run: pnpm -r typecheck
      # Unit tests; the integration tests skip themselves without a local Supabase.
      - run: pnpm --filter @parakeet/api --filter @parakeet/web test

  docker:
    name: Docker ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web, admin, jobs]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.app }}
          push: false
          # The worker image is loaded so the Auto Apply browser can be checked inside it.
          load: ${{ matrix.app == 'worker' }}
          tags: parakeet-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci
      # Auto Apply from Friday's servers: Chromium starts with its sandbox under the browser container's
      # seccomp and AppArmor profiles (deploy/) on Ubuntu 24.04, as on the server, and the
      # extension's filler is packaged where the applier reads it.
      - name: Auto Apply browser smoke test
        if: matrix.app == 'worker'
        run: |
          echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          # The browser container's AppArmor profile, loaded as deploy/deploy.sh does on the server.
          sudo apparmor_parser -r -W deploy/apparmor/parakeet-chromium
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/node --security-opt seccomp=deploy/chromium-seccomp.json \
            --security-opt apparmor=parakeet-chromium --security-opt no-new-privileges:true \
            -v "$PWD/apps/worker/test:/smoke:ro" parakeet-worker:ci node /smoke/image-smoke.mjs
      # Why the sandbox didn't start: Chromium's own error, AppArmor's denials, and which settings work.
      - name: Auto Apply browser sandbox diagnostics
        if: failure() && matrix.app == 'worker'
        run: |
          try() {
            echo "=== $1"
            shift
            docker run --rm --tmpfs /tmp --tmpfs /home/node "$@" parakeet-worker:ci \
              timeout 30 chromium --headless --disable-gpu --dump-dom 'data:text/html,<p>sandbox-ok</p>' 2>&1 | grep -E 'sandbox-ok|FATAL|sandbox|denied|Operation' | head -5 || true
          }
          try "seccomp profile + parakeet-chromium" --security-opt seccomp=deploy/chromium-seccomp.json --security-opt apparmor=parakeet-chromium
          try "seccomp profile + parakeet-chromium, no no-new-privileges" --security-opt seccomp=deploy/chromium-seccomp.json --security-opt apparmor=parakeet-chromium
          try "seccomp profile + apparmor unconfined" --security-opt seccomp=deploy/chromium-seccomp.json --security-opt apparmor=unconfined
          try "seccomp unconfined + parakeet-chromium" --security-opt seccomp=unconfined --security-opt apparmor=parakeet-chromium
          echo "=== AppArmor denials"
          sudo dmesg | grep -iE 'apparmor="DENIED"|userns' | tail -15 || true
          sudo aa-status 2>/dev/null | grep -E 'parakeet|profiles are loaded' || true

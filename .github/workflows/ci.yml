# Checks every pull request: typecheck the whole workspace, run the unit tests and build each server
# image, so a broken Dockerfile or build never reaches main (where Deploy ships it).
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @parakeet/shared --filter @parakeet/emails exec tsc -p tsconfig.json
      - run: pnpm -r typecheck
      # Unit tests; the integration tests skip themselves without a local Supabase.
      - run: pnpm --filter @parakeet/api --filter @parakeet/web test

  docker:
    name: Docker ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web, admin, jobs]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci

# Temporary: which AppArmor/seccomp settings let Chrome's sandbox start in a container on Ubuntu 24.04.
name: Sandbox probe
on:
  push:
    branches: [feat/friday-jobs]
    paths: ['deploy/apparmor/**', 'deploy/chromium-seccomp.json', '.github/workflows/sandbox-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          for p in deploy/apparmor/*; do sudo apparmor_parser -r -W "$p"; done
          docker pull -q mcr.microsoft.com/playwright:v1.56.1-noble
          C=/ms-playwright/chromium-1194/chrome-linux/chrome
          try() {
            echo "::group::$1"; shift
            docker run --rm --user pwuser --tmpfs /tmp "$@" mcr.microsoft.com/playwright:v1.56.1-noble \
              timeout 30 $C --headless --disable-gpu --dump-dom chrome://sandbox 2>&1 | sed 's/<[^>]*>/ /g' | tr -s ' \n' | grep -oE 'adequately sandboxed|not adequately sandboxed|No usable sandbox[^.]*|FATAL[^\n]{0,200}|Operation not permitted' | sort | uniq -c
            echo "::endgroup::"
          }
          S=deploy/chromium-seccomp.json
          try "A seccomp+parakeet-chromium (docker-default+userns)" --security-opt seccomp=$S --security-opt apparmor=parakeet-chromium
          try "B seccomp+parakeet-chromium-userns (unconfined+userns)" --security-opt seccomp=$S --security-opt apparmor=parakeet-chromium-userns
          try "C seccomp+apparmor=unconfined" --security-opt seccomp=$S --security-opt apparmor=unconfined
          try "D default seccomp+default apparmor" 
          echo "::group::denials"; sudo dmesg | grep 'apparmor="DENIED"' | grep -v posix_mqueue | sed 's/.*apparmor=/apparmor=/' | cut -c1-220 | sort | uniq -c | tail -20; echo "::endgroup::"

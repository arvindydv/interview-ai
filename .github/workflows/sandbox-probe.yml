# Temporary: which AppArmor/seccomp settings let Chrome's sandbox start in a container on Ubuntu 24.04.
name: Sandbox probe
on:
  push:
    branches: [feat/friday-jobs]
    paths: ['deploy/apparmor/**', 'deploy/chromium-seccomp.json', '.github/workflows/sandbox-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          for p in deploy/apparmor/*; do sudo apparmor_parser -r -W "$p"; done
          printf 'FROM node:24-bookworm-slim\nRUN apt-get update && apt-get install -y --no-install-recommends chromium && rm -rf /var/lib/apt/lists/*\nUSER node\n' | docker build -q -t probe -
          S=deploy/chromium-seccomp.json
          run() {
            docker run --rm --tmpfs /tmp --tmpfs /home/node "$@" 2>&1 | grep -vE 'dbus|Fontconfig|^[[:space:]]*$' | cut -c1-220 | tail -6 || true
          }
          try() {
            echo "::group::$1"; shift
            echo "--- /usr/lib/chromium/chromium"
            run "$@" probe timeout 40 /usr/lib/chromium/chromium --headless --disable-gpu --dump-dom 'data:text/html,<p>sandbox-ok</p>'
            echo "--- wrapper /usr/bin/chromium"
            run "$@" probe timeout 40 chromium --headless --disable-gpu --dump-dom 'data:text/html,<p>sandbox-ok</p>'
            echo "::endgroup::"
          }
          try "A docker-default+userns" --security-opt seccomp=$S --security-opt apparmor=parakeet-chromium
          try "A + read-only + no-new-privileges" --security-opt seccomp=$S --security-opt apparmor=parakeet-chromium --read-only --security-opt no-new-privileges:true
          try "B unconfined+userns" --security-opt seccomp=$S --security-opt apparmor=parakeet-chromium-userns
          try "B + read-only + no-new-privileges" --security-opt seccomp=$S --security-opt apparmor=parakeet-chromium-userns --read-only --security-opt no-new-privileges:true
          try "control: Docker defaults"
          echo "::group::denials"; sudo dmesg | grep 'apparmor="DENIED"' | sed 's/.*apparmor=/apparmor=/; s/ pid=[0-9]*//' | cut -c1-200 | sort | uniq -c | tail -20; echo "::endgroup::"

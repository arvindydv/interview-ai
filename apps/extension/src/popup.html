<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 320px; margin: 0; font: 13px/1.45 system-ui, sans-serif; color: #0c1322; background: #fff; }
      header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #e7e9ee; font-weight: 600; }
      header img { width: 22px; height: 22px; }
      main { padding: 14px 16px; }
      .muted { color: #5a6476; }
      .row { display: flex; justify-content: space-between; margin: 6px 0; }
      .warn { margin: 10px 0; padding: 8px 10px; border-radius: 8px; background: #fffbeb; color: #92400e; }
      .err { margin: 10px 0; padding: 8px 10px; border-radius: 8px; background: #fef2f2; color: #b91c1c; }
      button, a.btn { display: block; width: 100%; box-sizing: border-box; margin-top: 10px; padding: 9px; border-radius: 8px; border: 1px solid #d7dae1;
        background: #fff; font: inherit; font-weight: 600; text-align: center; text-decoration: none; color: inherit; cursor: pointer; }
      button.primary { background: #059669; border-color: #059669; color: #fff; }
      ol { margin: 8px 0 0; padding-left: 18px; max-height: 140px; overflow: auto; }
      li { margin: 2px 0; }
    </style>
  </head>
  <body>
    <header><img src="icon.png" alt="" /> Friday Auto Apply</header>
    <main id="app" class="muted">Loading…</main>
    <script type="module" src="popup.js"></script>
  </body>
</html>

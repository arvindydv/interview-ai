# Production stack for one server: Caddy (HTTPS) → web, admin, jobs, api; worker and Redis behind them, and
# (profile cloud-apply) the Auto Apply browser and applier.
# Run by deploy/deploy.sh, which sets TAG, reads DOMAIN / ACME_EMAIL / REGISTRY from
# /opt/parakeet/config.env, and writes /opt/parakeet/env/{api,worker}.env from SSM Parameter Store.
# Postgres + Auth are Supabase, not part of this stack.
name: parakeet

x-service: &service
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

services:
  caddy:
    <<: *service
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set in /opt/parakeet/config.env}
      ACME_EMAIL: ${ACME_EMAIL:?set in /opt/parakeet/config.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # TLS certificates; keep across deploys or Let's Encrypt rate-limits you
      - caddy-config:/config
    depends_on: [web, admin, jobs, api]
    mem_limit: 128m

  web:
    <<: *service
    image: ${REGISTRY:?}/parakeet-web:${TAG:?}
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 384m

  admin:
    <<: *service
    image: ${REGISTRY:?}/parakeet-admin:${TAG:?}
    environment:
      NODE_OPTIONS: --max-old-space-size=160
    mem_limit: 256m

  jobs:
    <<: *service
    image: ${REGISTRY:?}/parakeet-jobs:${TAG:?}
    environment:
      # Listings are fetched server-side from the API over the internal network.
      API_URL: http://api:4000
      NODE_OPTIONS: --max-old-space-size=160
    depends_on: [api]
    mem_limit: 256m

  api:
    <<: *service
    image: ${REGISTRY:?}/parakeet-api:${TAG:?}
    env_file: ${PARAKEET_HOME:-/opt/parakeet}/env/api.env
    environment:
      REDIS_URL: redis://redis:6379
      # Caddy is the only hop in front: trust its X-Forwarded-For for the client IP.
      TRUST_PROXY: 1
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      redis: { condition: service_healthy }
    stop_grace_period: 30s
    mem_limit: 512m

  worker:
    <<: *service
    image: ${REGISTRY:?}/parakeet-worker:${TAG:?}
    env_file: ${PARAKEET_HOME:-/opt/parakeet}/env/worker.env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      redis: { condition: service_healthy }
    stop_grace_period: 60s # let a running job (resume analysis, email) finish
    mem_limit: 384m

  # Auto Apply from Friday's servers, in two containers so job boards' pages never run next to a secret.
  # Off until COMPOSE_PROFILES=cloud-apply is in /opt/parakeet/config.env (it needs ~1 GB more memory
  # than a t3.small has; see docs/DEPLOYMENT.md).
  #
  #   browser  Chromium only (apps/worker/src/browserServer.ts), sandboxed. No secrets but the path the
  #            applier connects to; can reach the internet, not the API, Redis or the other services.
  #   applier  takes applications from the API with its one token (APPLIER_TOKEN, valid only on
  #            /v1/applier/*) and drives the browser. No database, Redis or other credentials.
  browser:
    <<: *service
    profiles: [cloud-apply]
    image: ${REGISTRY:?}/parakeet-worker:${TAG:?}
    command: ["node", "dist/browserServer.js"]
    env_file: ${PARAKEET_HOME:-/opt/parakeet}/env/browser.env
    networks: [browser]
    # Docker's default seccomp and AppArmor profiles, each plus only what Chrome's sandbox needs (user
    # namespaces); deploy.sh loads the AppArmor one. CI checks the sandbox starts with exactly these.
    security_opt:
      - seccomp=./chromium-seccomp.json
      - apparmor=parakeet-chromium
      - no-new-privileges:true
    read_only: true
    tmpfs: ["/tmp:size=256m,uid=1000,gid=1000,mode=0700", "/home/node:size=64m,uid=1000,gid=1000,mode=0700"]
    shm_size: 512m
    mem_limit: 1024m
    stop_grace_period: 30s

  applier:
    <<: *service
    profiles: [cloud-apply]
    image: ${REGISTRY:?}/parakeet-worker:${TAG:?}
    command: ["node", "dist/applier.js"]
    env_file: ${PARAKEET_HOME:-/opt/parakeet}/env/applier.env
    environment:
      APPLIER_API_URL: http://api:4000
      AUTO_APPLY_CLOUD_SLOTS: '2'
      NODE_OPTIONS: --max-old-space-size=128
    networks: [default, browser]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    depends_on:
      api: { condition: service_healthy }
      browser: { condition: service_started }
    stop_grace_period: 9m # an application being sent finishes (runs are capped at 8 minutes)
    mem_limit: 192m

  redis: { condition: service_healthy }
    stop_grace_period: 30s
    mem_limit: 512m

  worker:
    <<: *service
    image: ${REGISTRY:?}/parakeet-worker:${TAG:?}
    env_file: ${PARAKEET_HOME:-/opt/parakeet}/env/worker.env
    environment:
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      redis: { condition: service_healthy }
    stop_grace_period: 60s # let a running job (resume analysis, email) finish
    mem_limit: 384m

  # Auto Apply from Friday's servers: the worker image, its own process, as each application is a
  # Chromium tab. Chrome's sandbox needs user namespaces, which Docker's default seccomp profile blocks,
  # so it runs without one; this container holds nothing but what the worker has.
  applier:
    <<: *service
    image: ${REGISTRY:?}/parakeet-worker:${TAG:?}
    command: ["node", "dist/applier.js"]
    env_file: ${PARAKEET_HOME:-/opt/parakeet}/env/worker.env
    environment:
      REDIS_URL: redis://redis:6379
      AUTO_APPLY_CHROME_NO_SANDBOX: '1'
      AUTO_APPLY_CLOUD_SLOTS: '2'
    depends_on:
      redis: { condition: service_healthy }
    stop_grace_period: 60s # let an application being sent finish
    shm_size: 512m
    mem_limit: 1536m

  redis:
    <<: *service
    image: redis:7.4-alpine
    # BullMQ needs noeviction: under any eviction policy Redis silently drops queued jobs when full.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m

volumes:
  caddy-data:
  caddy-config:
  redis-data:

networks:
  default: {}
  # The browser's own network: internet access, and the applier, nothing else.
  browser: {}
